name: Verify Study Buddy
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Validate proxy configuration
        run: docker run --rm -e BUDDY_HOST=study.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and smoke test the production container
        run: |
          docker build -t study-buddy:test .
          docker run -d --name study-buddy-smoke -p 127.0.0.1:8000:8000 -e BUDDY_PUBLIC_ORIGIN=https://study.example.test -e BUDDY_EMBEDDINGS=lexical study-buddy:test
          trap 'docker logs study-buddy-smoke; docker rm -f study-buddy-smoke' EXIT
          curl --retry 12 --retry-delay 2 --retry-all-errors --max-time 4 --fail http://127.0.0.1:8000/api/health
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/subjects)" = 401
          curl --fail http://127.0.0.1:8000/ | grep -q 'KTU Study Buddy'
